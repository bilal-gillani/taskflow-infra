name: Deploy App — TaskFlow

# ---------------------------------------------------------------------------
# IMPORTANT: This file belongs in the APP REPO (bilal-gillani/taskflow-cicd)
# at path: .github/workflows/deploy-app.yml
#
# It is authored here in the infra repo for review, then copied to the app repo.
# ---------------------------------------------------------------------------
#
# Triggers:
#   Push to main → SSH into the App VM, git pull, restart Apache
#
# Required GitHub Secrets (set in bilal-gillani/taskflow-cicd repo settings):
#   APP_VM_IP           — Public IP of the App VM (update after terraform apply)
#   DEPLOY_SSH_KEY      — Private key of the GitHub deploy keypair
#                         (public key is in /home/gillani/.ssh/authorized_keys on the VM,
#                          added there by Ansible using github_deploy_public_key in group_vars)
#   ADMIN_USERNAME      — VM admin username (e.g. gillani)
# ---------------------------------------------------------------------------

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Azure App VM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app code
        uses: actions/checkout@v4

      # --- Lint / basic validation ---
      - name: PHP syntax check
        run: |
          find . -name "*.php" -exec php -l {} \; 2>&1 | grep -v "No syntax errors"
          echo "PHP lint passed"

      # --- Deploy via SSH ---
      - name: Write SSH deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy — git pull + restart Apache
        run: |
          ssh -o StrictHostKeyChecking=no \
              -i ~/.ssh/deploy_key \
              ${{ secrets.ADMIN_USERNAME }}@${{ secrets.APP_VM_IP }} \
              "
                set -e
                echo '--- Pulling latest code ---'
                cd /var/www/html/taskflow
                sudo git pull origin main

                echo '--- Setting permissions ---'
                sudo chown -R www-data:www-data /var/www/html/taskflow

                echo '--- Restarting Apache ---'
                sudo systemctl restart apache2

                echo '--- Deployment complete ---'
              "

      - name: Verify app is responding
        run: |
          sleep 5
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            http://${{ secrets.APP_VM_IP }}/taskflow/index.php)
          echo "HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERROR: App returned $HTTP_STATUS — deployment may have failed"
            exit 1
          fi
          echo "App is responding with 200 OK"
