[defaults]
# Use dynamic inventory by default when running from the ansible/ directory
inventory          = inventory/dynamic_inventory.py
remote_user        = gillani
private_key_file   = ~/.ssh/az-vm-ssh
host_key_checking  = False
retry_files_enabled = False
roles_path         = roles   # relative to ansible/ working directory → resolves to ansible/roles/

# Pretty output
stdout_callback    = yaml
stderr_callback    = yaml

[privilege_escalation]
become      = True
become_method = sudo
become_user = root
