# ---------------------------------------------------------------------------
# group_vars/all.yml
# Variables shared across all hosts. Secrets are fetched from Azure Key Vault
# at runtime — never hardcoded here.
# ---------------------------------------------------------------------------

# --- App config ---
app_repo_url: "https://github.com/bilal-gillani/taskflow-app-cicd.git"
app_repo_dest: "/var/www/html/taskflow"
app_user: "www-data"

# --- GitHub Actions deploy key ---
github_deploy_public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICYR+IxNvQ0ssUtcLdvPK1zqLSTgg2ykV2CRgkvJcoAQ github-actions-deploy"

# --- Azure Key Vault ---
key_vault_name: "secrets-kv-1029" # ← change here only if KV name changes
key_vault_uri: "https://secrets-kv-1029.vault.azure.net/"
kv_secret_name_db_pass: "taskflow-db-pass"

# --- DB config ---
db_name: "taskflow"
db_user: "taskflow_user"
# db_password is fetched from Key Vault in each role
