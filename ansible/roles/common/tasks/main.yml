---
# ---------------------------------------------------------------------------
# common role — runs on ALL hosts (app + db)
# Handles: package updates, common utilities, security hardening baseline
# ---------------------------------------------------------------------------

- name: Update apt cache and upgrade packages
  ansible.builtin.apt:
    update_cache: yes
    upgrade: dist
    cache_valid_time: 3600

- name: Install common utilities
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - git
      - unzip
      - ufw
      - fail2ban
      - python3
      - python3-pip
    state: present

- name: Ensure fail2ban is enabled and started
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: yes

- name: Set timezone to UTC
  community.general.timezone:
    name: UTC
